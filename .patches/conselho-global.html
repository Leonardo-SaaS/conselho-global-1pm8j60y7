<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conselho Global — Jogo Educativo</title>
    <style>
      /* =====================================================================
       DESIGN SYSTEM — "MESA DE CONSELHO" DIPLOMÁTICA
       - Fundo: Azul-marinho escuro #0A1A2F -> #0E2440
       - Pergaminho: #F6F1E7 (borda #D9CFBA)
       - Acento: Dourado #C9A227
       - Botão ONU: #009EDB / Game Over: #B23A48
       - Barras: Econômica (azul), Direitos Humanos (verde), Humanitária (laranja)
       - Fases: 1 (1944–1970), 2 (1990–2001), 3 (1993–2015) e 4 (2024–2030)
       ===================================================================== */
      :root {
        --bg-top: #0a1a2f;
        --bg-bottom: #0e2440;
        --parchment: #f6f1e7;
        --parchment-border: #d9cfba;
        --parchment-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        --text-main: #1e2a38;
        --text-muted: #5a6b7c;
        --gold-brass: #c9a227;
        --gold-soft: #f4e8c1;
        --onu-blue: #009edb;
        --onu-blue-hover: #0084b8;
        --danger-red: #b23a48;
        --danger-red-hover: #962f3c;
        --alert-red: #d64545;
        --bar-econ-base: #2e7dd1;
        --bar-econ-high: #4da3ff;
        --bar-dir-base: #2e9e5b;
        --bar-dir-high: #3fcf8e;
        --bar-hum-base: #e8871e;
        --bar-hum-high: #ffa94d;
        --font-serif: Georgia, 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
        --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
